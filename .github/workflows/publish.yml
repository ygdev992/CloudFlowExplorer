name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # e.g. v1.0.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CloudFlowExplorer.csproj

      - name: Pack
        run: dotnet pack CloudFlowExplorer.csproj --configuration Release -o ./artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile username, not email

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
